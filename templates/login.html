<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — ClassEdge</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    .auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(100%,440px);padding:36px;border:1px solid var(--line,#263248);border-radius:22px;background:rgba(15,22,38,.92);box-shadow:0 24px 80px #0006}.auth-card h2{margin:12px 0}.auth-card p{color:#aab4ca;line-height:1.6}.auth-card label{display:block;margin:20px 0 7px;font-weight:600}.auth-card input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #33405a;border-radius:10px;background:#0b1120;color:#fff;font:inherit}.auth-card button{width:100%;margin-top:24px}.auth-error{min-height:24px;color:#ff8793}.auth-success{min-height:24px;color:#34e5a1}.auth-mark{color:#00e5ff;font-size:13px;letter-spacing:.12em;text-transform:uppercase}.auth-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.auth-options button{margin:0}.auth-options button[aria-pressed="true"]{outline:2px solid #00e5ff}.auth-hint{font-size:13px}
  </style>
</head>
<body>
  <div class="bg-orb orb-a" aria-hidden="true"></div><div class="bg-orb orb-b" aria-hidden="true"></div>
  <main class="auth-wrap"><section class="auth-card">
    <a class="brand" href="/" style="text-decoration:none;color:inherit"><span class="brand-mark">◆</span><div><h1>Class<span>Edge</span></h1><p class="tagline">CGPA Command Center</p></div></a>
    <p class="auth-mark">Secure account access</p>
    <div class="auth-options" role="group" aria-label="Choose account action">
      <button class="btn btn-primary" id="choose-login" type="button" aria-pressed="true">Log in</button>
      <button class="btn btn-ghost" id="choose-register" type="button" aria-pressed="false">Create account</button>
    </div>
    <h2 id="auth-title">Log in</h2>
    <p id="auth-description">Use your Gmail address and password to open the grading dashboard.</p>
    <form id="auth-form">
      <label for="email">Gmail address</label><input id="email" name="email" type="text" autocomplete="username" maxlength="254" placeholder="you@gmail.com" required />
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="72" required />
      <p class="auth-hint" id="password-hint" hidden>Use 8+ characters with 3 of: lowercase, uppercase, number, symbol. A 12+ character passphrase also works.</p>
      <p class="auth-error" id="auth-error" role="status" aria-live="polite"></p>
      <button class="btn btn-primary" id="auth-submit" type="submit">Sign in</button>
    </form>
  </section></main>
  <script>
  "use strict";
  const form=document.getElementById("auth-form"), errorBox=document.getElementById("auth-error");
  let register=false;
  const chooseLogin=document.getElementById("choose-login"), chooseRegister=document.getElementById("choose-register");
  function setMode(create){register=create;chooseLogin.setAttribute("aria-pressed",String(!create));chooseRegister.setAttribute("aria-pressed",String(create));chooseLogin.className=create?"btn btn-ghost":"btn btn-primary";chooseRegister.className=create?"btn btn-primary":"btn btn-ghost";document.getElementById("auth-title").textContent=create?"Create your account":"Log in";document.getElementById("auth-description").textContent=create?"Register with your Gmail address and choose a strong password.":"Use your Gmail address and password to open the grading dashboard.";document.getElementById("email").type=create?"email":"text";document.getElementById("email").autocomplete=create?"email":"username";document.getElementById("password").autocomplete=create?"new-password":"current-password";document.getElementById("password-hint").hidden=!create;document.getElementById("auth-submit").textContent=create?"Create account":"Log in";errorBox.textContent="";}
  chooseLogin.addEventListener("click",()=>setMode(false));chooseRegister.addEventListener("click",()=>setMode(true));
  fetch("/api/auth/status").catch(()=>{errorBox.textContent="Could not connect to the server."});
  form.addEventListener("submit",async e=>{e.preventDefault();errorBox.textContent="";errorBox.className="auth-error";const button=document.getElementById("auth-submit");button.disabled=true;try{const response=await fetch(register?"/api/auth/register":"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:form.email.value,password:form.password.value})});const result=await response.json();if(!response.ok)throw new Error(result.error||"Sign in failed.");errorBox.className="auth-success";errorBox.textContent=register?"Account created successfully. Redirecting…":"Login successful. Redirecting…";setTimeout(()=>location.assign("/home"),1000);}catch(err){errorBox.textContent=err.message;button.disabled=false;}});
  </script>
</body>
</html>
